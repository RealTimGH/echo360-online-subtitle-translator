<section id="transcripts-panel" role="tabpanel" aria-labelledby="transcripts-tab">
  <div id="search-transcripts" data-test-id="search-transcripts">
    <div class="input-div">
      <input placeholder="Search" type="text" data-test-id="TextInput" id="search-transcripts_input" class="sc-kIPQKe saTqE" value="">
    </div>
  </div>
  <div class="transcript-list ReactVirtualized__Grid ReactVirtualized__List" role="grid">
    <div class="ReactVirtualized__Grid__innerScrollContainer" role="rowgroup">
      <div style="height:44px;left:2px;position:absolute;top:0;width:calc(100% - 4px)">
        <div tabindex="-1">
          <div></div>
          <dd title="0.00 sec" data-test-component="Content">
            <span role="button" tabindex="-1">A short English cue.</span>
          </dd>
        </div>
      </div>
      <div style="height:44px;left:2px;position:absolute;top:44px;width:calc(100% - 4px)">
        <div tabindex="-1">
          <div></div>
          <dd title="1.00 min" data-test-component="Content">
            <span role="button" tabindex="-1">A second English cue.</span>
          </dd>
        </div>
      </div>
    </div>
  </div>
</section>
