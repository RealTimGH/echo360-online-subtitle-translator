name: Build packaged backend

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    tags:
      - "*.*.*"

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            artifact: backend-windows-x64
            archive: dist/echo360-online-subtitle-translator-backend-windows-x64.zip
          - runner: macos-15
            artifact: backend-macos-arm64
            archive: dist/echo360-online-subtitle-translator-backend-macos-arm64.tar.gz
          - runner: macos-15-intel
            artifact: backend-macos-x64
            archive: dist/echo360-online-subtitle-translator-backend-macos-x64.tar.gz

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-argos.txt
            backend/requirements-build.txt

      - name: Cache Argos model assets
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/backend/assets/argos
          key: argos-1.11.0-en-zh-zt-${{ matrix.artifact }}-${{ hashFiles('backend/requirements-argos.txt', 'scripts/build-backend.py') }}

      - name: Install build dependencies
        run: python -m pip install -r backend/requirements-build.txt

      - name: Validate Python runtime
        run: |
          python -m pip check
          python -m unittest discover -s tests/python -p "test_*.py"

      - name: Build standalone backend
        run: python scripts/build-backend.py

      - name: Smoke-test packaged backend and Argos
        run: python scripts/smoke-backend.py --check-argos

      - name: Upload packaged backend
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
